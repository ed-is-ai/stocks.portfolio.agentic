name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --all-extras --dev
      # The boot-splash tests drive a real browser. playwright ships the
      # client library as a dependency but never the browser binary, so
      # without this step they fail rather than skip.
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
