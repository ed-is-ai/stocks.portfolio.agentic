<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/watchlist.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: var(--surface);
      color: var(--primary);
    }

    /* Minimal flat navbar so a directly-opened fragment page still looks
       like part of the app without index.html's full style block. */
    .navbar {
      background: var(--navbar-grad) !important;
      padding: 0.6rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .navbar-brand {
      font-weight: var(--fw-bold);
      font-size: var(--fs-lg);
      color: white !important;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.12);
    }
    .brand-mark .bi { color: #fff; font-size: 1rem; }
    .brand-name { color: #fff; }
    .brand-name em { font-style: normal; color: rgba(255, 255, 255, 0.6); }

    /* ── HTMX spinner ──────────────────────────────── */
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="/">
      <span class="brand-mark"><i class="bi bi-graph-up"></i></span>
      <span class="brand-name">Stock <em>Manager</em></span>
    </a>
    <span id="spinner" class="htmx-indicator spinner-border spinner-border-sm text-light"></span>
  </nav>
  <div class="container-fluid mt-3 px-3">
    {# Fragments are trusted, app-owned templates — never user-supplied HTML. #}
    <div id="tab-content">{{ page_content | safe }}</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/strategy-manager.js?v=20260824-1" defer></script>
</body>
</html>
