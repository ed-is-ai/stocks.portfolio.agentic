<section id="preparation-activity-{{ job.id }}"{% if not terminal %} hx-get="/strategy-manager/activities/{{ job.id }}/status?last_seen_version={{ job.status_version }}" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %} class="strategy-activity"><h1>Evidence preparation run</h1><p><strong>Status:</strong> {{ job.status.value|title }}</p><div class="pipeline-status pipeline-status-inline {{ activity_bar.state }}">{% include "_activity_bar.html" %}</div>{% if child_url %}<a href="{{ child_url }}">Open backtest</a>{% endif %}{% if job.failure_detail %}<p>{{ job.failure_detail }}</p>{% endif %}</section>
