<section id="preparation-activity-{{ job.id }}"{% if not terminal %} hx-get="/strategy-manager/activities/{{ job.id }}/status?last_seen_version={{ job.status_version }}" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %}><h1>Evidence preparation run</h1><p><strong>Status:</strong> {{ job.status.value|title }}</p>{% if child_url %}<a href="{{ child_url }}">Open backtest</a>{% endif %}{% if job.failure_detail %}<p>{{ job.failure_detail }}</p>{% endif %}</section>
