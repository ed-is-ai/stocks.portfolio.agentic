<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/watchlist.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ── Base ──────────────────────────────────────── */
    /* Design tokens come from tokens.css; font family/size/numeric
       treatment come from theme.css. */
    body {
      background: var(--surface);
      color: var(--primary);
    }

    /* ── Navbar — flat masthead, not a gradient banner ────────────── */
    .navbar {
      background: var(--navbar-grad) !important;
      padding: 0.6rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .navbar-brand {
      font-weight: var(--fw-bold);
      font-size: var(--fs-lg);
      letter-spacing: -0.01em;
      color: white !important;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    /* Logo mark: flat ink square, no gradient badge */
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.12);
    }
    .brand-mark .bi { color: #fff; font-size: 1rem; }
    .brand-name { color: #fff; }
    .brand-name em { font-style: normal; color: rgba(255,255,255,0.6); }
    .navbar-tag {
      font-size: var(--fs-sm);
      color: rgba(255,255,255,0.55);
      padding-left: 0.7rem;
      border-left: 1px solid rgba(255,255,255,0.16);
    }

    /* ── Tab bar — hairline underline, no active-tab gradient ──────── */
    .tab-bar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0 0.5rem;
      display: flex;
      align-items: flex-end;
      overflow-x: auto;
    }
    .nav-tabs { border: none; flex-wrap: nowrap; }
    .nav-tabs .nav-link { white-space: nowrap; }
    .nav-tabs .nav-item { margin-bottom: -1px; }
    .nav-tabs .nav-link {
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--muted);
      font-size: var(--fs-md);
      font-weight: var(--fw-medium);
      padding: 0.65rem 1rem;
      transition: color .15s, border-color .15s;
    }
    .nav-tabs .nav-link:hover { color: var(--primary); background: none; border-bottom-color: var(--border); }
    .nav-tabs .nav-link.active {
      color: var(--primary);
      font-weight: var(--fw-semibold);
      border-bottom: 2px solid var(--primary);
      background: none;
    }
    .nav-tabs .nav-link.active .bi { color: var(--primary); }
    .nav-tabs .nav-link .bi { margin-right: 0.3rem; font-size: 0.82rem; }

    /* ── Content panel — flat, hairline border, no shadow/rounding ─── */
    #tab-content {
      background: white;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0;
      padding: 1.25rem 1.5rem;
      min-height: 420px;
    }

    /* ── Tables — hairline rules, flat header, no rounding ────────── */
    .tbl-wrap { overflow-y: auto; max-height: 72vh; border-radius: 0; border: 1px solid var(--border); }
    /* Short viewports (e.g. landscape phones): leave enough room
       above the fixed pipeline status bar that its own horizontal
       scrollbar never lands under it. Scoped to the watchlist wrap
       (.wl-tbl-wrap, set in watchlist.css) so portfolio/history
       tables keep their existing 72vh behavior. */
    @media (max-height: 480px) {
      .wl-tbl-wrap { max-height: 58vh; }
    }
    .table { font-size: var(--fs-sm); margin-bottom: 0; }
    .table thead th {
      background: var(--primary);
      color: rgba(255,255,255,0.88);
      font-weight: var(--fw-semibold);
      font-size: var(--fs-2xs);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: none;
      padding: 0.58rem 0.75rem;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .ticker-detail .table thead th { position: static; }
    .table tbody td { padding: 0.42rem 0.75rem; border-color: var(--border); vertical-align: middle; }
    .table tbody tr:hover td { background: #f8fafc; }
    .table tbody tr:last-child td { border-bottom: none; }

    /* ── Grouped-table subtotal/total rows (Realised P&L) ─────── */
    .table-subtotal-row td { background: #f8fafc; font-weight: 600; border-top: 2px solid var(--border); }
    .table-subtotal-row:hover td { background: #f8fafc; }
    .table-total-row td {
      background: var(--primary);
      color: white;
      font-weight: 700;
      position: sticky;
      bottom: 0;
    }
    .table-total-row:hover td { background: var(--primary); }

    /* ── PnL ───────────────────────────────────────── */
    .pos { color: var(--green); font-weight: 600; }
    .neg { color: var(--red);   font-weight: 600; }

    /* ── Stat cards (portfolio summary) — flat, hairline, no shadow ── */
    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-top: 2px solid var(--primary);
      border-radius: 0;
      padding: 0.65rem 1.1rem;
      min-width: 150px;
    }
    .stat-card .slbl {
      font-size: var(--fs-2xs);
      font-weight: var(--fw-semibold);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.2rem;
    }
    .stat-card .sval { font-size: var(--fs-lg); font-weight: var(--fw-bold); color: #1e293b; line-height: var(--lh-tight); }

    /* ── Exit signal badges ────────────────────────── */
    .exit-badge {
      display: inline-block;
      padding: 0.18rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: help;
    }
    .exit-EXIT { background: var(--red-bg);   color: var(--red);   }
    .exit-ADD  { background: var(--green-bg); color: var(--green); }

    /* ── FX-unavailable flag badge (Realised P&L) ──────────────── */
    .flag-badge {
      display: inline-block;
      padding: 0.18rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--amber-bg);
      color: var(--amber);
    }

    /* ── Unmatched-sell panel (Story 1.5) ──────────── */
    .unmatched-panel {
      background: #fffdf6;
      border: 1px solid var(--amber-bg);
      border-radius: 0;
      padding: 0.75rem 1rem;
    }
    .unmatched-panel > summary {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--amber);
      cursor: pointer;
    }
    tr.acked-row td { opacity: 0.6; }

    .ack-toggle {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      font-weight: 600;
      background: white;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
    }
    .ack-toggle.acked {
      background: var(--green-bg);
      border: 1px solid var(--green);
      color: var(--green);
    }

    .ack-badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 0.3rem;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--green-bg);
      color: var(--green);
    }

    /* ── Portfolio row tints ───────────────────────── */
    tr.row-exit td { background: #fff8f8 !important; }
    tr.row-exit:hover td { background: #fee2e2 !important; }

    /* ── Action buttons — flat, no rounding ────────── */
    .btn-buy-sm, .btn-sell-sm, .btn-adjust-sm {
      border: none;
      font-weight: 600;
      font-size: 0.72rem;
      padding: 0.22rem 0.62rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background .15s;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .btn-buy-sm    { background: var(--green); color: white; }
    .btn-buy-sm:hover    { background: #15803d; }
    .btn-sell-sm   { background: var(--red);   color: white; }
    .btn-sell-sm:hover   { background: #b91c1c; }
    .btn-adjust-sm { background: #4f46e5;      color: white; }
    .btn-adjust-sm:hover { background: #3730a3; }

    /* ── Run log ───────────────────────────────────── */
    .badge-status {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .status-ok    { background: var(--green-bg);  color: var(--green);  }
    .status-error { background: var(--red-bg);    color: var(--red);    }
    .status-skip  { background: var(--amber-bg);  color: var(--amber);  }
    .rl-num {
      display: inline-block;
      min-width: 1.6rem;
      text-align: center;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-weight: 700;
      font-size: 0.76rem;
    }
    .rl-buy  { background: var(--green-bg); color: var(--green); }
    .rl-sell { background: var(--red-bg);   color: var(--red);   }
    .rl-error { font-size: 0.72rem; color: var(--red); }

    /* ── Toolbar above tables ──────────────────────── */
    .tbl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
      font-size: var(--fs-sm);
      color: var(--muted);
    }

    /* ── HTMX spinner ──────────────────────────────── */
    .spinner-border-sm { width: 1rem; height: 1rem; }

    /* ── Spin animation ────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    /* ── Modals ────────────────────────────────────── */
    .modal-content { border: 1px solid var(--border); border-radius: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .modal-header { padding: 0.85rem 1.25rem; border-radius: calc(0.5rem - 1px) calc(0.5rem - 1px) 0 0; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .modal-header .btn-close { filter: invert(1) opacity(0.7); }
    .modal-title { font-weight: var(--fw-semibold); font-size: var(--fs-base); }
    .modal-body { padding: 1.25rem; }
    .modal-footer { padding: 0.75rem 1.25rem; background: #f8fafc; border-top: 1px solid var(--border); border-radius: 0 0 calc(0.5rem - 1px) calc(0.5rem - 1px); }
    .form-label { font-size: 0.76rem; font-weight: 600; color: #374151; margin-bottom: 0.3rem; }
    .form-control, .form-select { font-size: 0.85rem; border-color: var(--border); }
    .form-control:focus, .form-select:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
    .pipeline-status-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: white; border-top: 1px solid var(--border); box-shadow: 0 -2px 8px rgba(0,0,0,.06); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pipeline-status { min-height: 2.35rem; display: flex; align-items: center; gap: 1rem; padding: .45rem 1.25rem; font-size: .78rem; color: var(--muted); overflow-x: auto; }
    .pipeline-status-summary, .pipeline-stages, .pipeline-stage { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
    .pipeline-stages { list-style: none; margin: 0; padding: 0; gap: .75rem; }
    .pipeline-stage.pending, .pipeline-stage.skipped { opacity: .55; }
    .pipeline-stage.complete { color: var(--green); }
    .pipeline-stage.failed, .pipeline-status-error { color: var(--red); }
    .pipeline-stage-count { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pipeline-status.running { color: var(--blue); background: linear-gradient(100deg, var(--blue-bg) 0%, #eff6ff 45%, var(--blue-bg) 80%); background-size: 220% 100%; animation: pipeline-sheen 1.8s linear infinite; }
    .pipeline-status.running .pipeline-status-summary > .bi { animation: pipeline-spin 1s linear infinite; }
    .pipeline-status.failed { color: var(--red); background: var(--red-bg); }
    .pipeline-status.complete { color: var(--green); background: var(--green-bg); }
    .pipeline-status.partial, .pipeline-status.skipped { color: var(--amber); background: var(--amber-bg); }
    .pipeline-status-freshness { margin-left: auto; flex-wrap: nowrap; }
    .pipeline-status-freshness .local-time { font-variant-numeric: tabular-nums; }
    .pipeline-breakdown-toast-container { right: 0; bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: min(24rem, 90vw); }
    .pipeline-breakdown-toast .toast-body { font-size: .8rem; display: flex; flex-direction: column; gap: .4rem; }
    @keyframes pipeline-sheen { to { background-position: -220% 0; } }
    @keyframes pipeline-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pipeline-status.running, .pipeline-status.running .pipeline-status-summary > .bi { animation: none; } }
    /* Reserve room for the fixed pipeline status bar (incl. its own
       safe-area padding) so it never sits over the last table row. */
    body { padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px)); }
    .pipeline-confirmation { position: fixed; inset: 0; z-index: 1050; display: grid; place-items: center; background: rgba(15, 23, 42, .42); padding: 1rem; }
    .pipeline-confirmation-card { width: min(32rem, 100%); background: white; border-radius: .65rem; box-shadow: 0 20px 50px rgba(0,0,0,.24); padding: 1.3rem; }
    .pipeline-confirmation h2 { font-size: 1rem; font-weight: 700; color: var(--amber); margin: 0 0 .75rem; }
    .pipeline-confirmation ul { padding-left: 1.2rem; margin-bottom: .9rem; font-size: .85rem; }
    .pipeline-confirmation li { margin-bottom: .55rem; }
    .pipeline-confirmation li span { color: var(--muted); }
    .pipeline-confirmation-actions { display: flex; justify-content: flex-end; gap: .5rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center gap-3">
    <span class="navbar-brand">
      <span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span>
      <span class="brand-name">Stock<em>Manager</em></span>
    </span>
  </div>
  <div class="d-flex align-items-center gap-2">
    <!-- Notification centre (#80) -->
    <div class="nav-bell dropdown">
      <button id="nav-bell-btn" class="btn btn-sm nav-bell-btn" type="button"
              data-bs-toggle="dropdown" data-bs-auto-close="outside"
              aria-expanded="false" title="Notifications"
              hx-get="/partials/notifications" hx-target="#notif-list"
              hx-swap="innerHTML" hx-trigger="click">
        <i class="bi bi-bell"></i>
        <span id="notif-badge" class="notif-badge"
              hx-get="/notifications/count" hx-trigger="load, every 20s"
              hx-target="this" hx-swap="outerHTML"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end notif-dropdown p-0">
        <div id="notif-list" hx-get="/partials/notifications"
             hx-trigger="load" hx-swap="innerHTML">
          <div class="notif-empty"><span>Loading…</span></div>
        </div>
      </div>
    </div>
    <button id="refresh-data-button" class="btn btn-sm btn-light btn-refresh"
            hx-post="/refresh-data"
            hx-target="#tab-content" hx-swap="innerHTML"
            hx-indicator="#spinner"
            title="Run the full scan and analysis using cached WhaleWisdom / StockTwits data — faster">
      <i class="bi bi-arrow-clockwise"></i> Refresh Data
    </button>
    <div class="dropdown d-inline-block">
      <button id="refresh-institutional-button" type="button"
              class="btn btn-sm btn-light btn-refresh dropdown-toggle"
              data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
              title="Run the full scan and analysis after refreshing WhaleWisdom / StockTwits from source — slower">
        <i class="bi bi-bank"></i> Refresh Institutional Data
      </button>
      <div class="dropdown-menu p-3" style="min-width: 20rem;">
        <form hx-post="/refresh-data"
              hx-target="#tab-content" hx-swap="innerHTML"
              hx-indicator="#spinner"
              hx-on::after-request="bootstrap.Dropdown.getOrCreateInstance(document.getElementById('refresh-institutional-button')).hide()">
          <input type="hidden" name="extract" value="true">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="true"
                   name="force_whale_wisdom" id="force-whale-wisdom">
            <label class="form-check-label" for="force-whale-wisdom">
              Force-refresh WhaleWisdom heat map
              <span class="text-muted d-block small">else: reuse &lt; 7-day cache</span>
            </label>
          </div>
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" value="true"
                   name="force_stocktwits" id="force-stocktwits">
            <label class="form-check-label" for="force-stocktwits">
              Force-refresh StockTwits Top 25
              <span class="text-muted d-block small">else: newest-email only</span>
            </label>
          </div>
          <button type="submit" class="btn btn-sm btn-primary mt-3">Run</button>
        </form>
      </div>
    </div>
    <span id="spinner" class="htmx-indicator spinner-border spinner-border-sm text-light"></span>
  </div>
</nav>

<div class="container-fluid mt-3 px-3">

  <!-- Tab bar -->
  <div class="tab-bar">
    <ul class="nav nav-tabs" id="mainTabs">
      <li class="nav-item">
        <a class="nav-link active" id="tab-stock-scanner"
           hx-get="/partials/stock-scanner" hx-target="#tab-content" hx-trigger="click, load" hx-indicator="#spinner">
          <i class="bi bi-eye"></i>Stock Scanner
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-portfolio"
           hx-get="/partials/portfolio" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner"
           hx-vals='js:{portfolio_id: (typeof activePortfolio === "function" ? activePortfolio() : "")}'>
          <i class="bi bi-briefcase"></i>Portfolio
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-history"
           hx-get="/partials/history" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner">
          <i class="bi bi-clock-history"></i>Trade History
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-realised-pnl"
           hx-get="/partials/realised-pnl" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner"
           hx-vals='js:{portfolio_id: (typeof activePortfolio === "function" ? activePortfolio() : "")}'>
          <i class="bi bi-arrow-repeat"></i>Realised P&amp;L
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-runlog"
           hx-get="/partials/runlog" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner">
          <i class="bi bi-journal-text"></i>Run Log
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-strategy-manager"
           hx-get="/partials/strategy-manager" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner">
          <i class="bi bi-graph-up-arrow"></i>Strategy Manager
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-settings"
           hx-get="/partials/settings" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner">
          <i class="bi bi-gear"></i>Settings
        </a>
      </li>
    </ul>
  </div>

  <!-- Tab content -->
  <div id="tab-content">
    <div class="text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm mb-2 d-block mx-auto"></div>
      Loading…
    </div>
  </div>

</div>

<div id="pipeline-status" class="pipeline-status-bar"
     hx-get="/pipeline-status" hx-trigger="load" hx-swap="innerHTML"></div>
<div id="pipeline-confirmation"></div>

<!-- Buy Modal -->
<div class="modal fade" id="buyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background:#166534;">
        <h5 class="modal-title text-white"><i class="bi bi-cart-plus me-2"></i>Record Buy</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form hx-post="/trades" hx-target="#tab-content" hx-swap="innerHTML"
            hx-on::after-request="bootstrap.Modal.getInstance(document.getElementById('buyModal')).hide()">
        <input type="hidden" name="action" value="BUY">
        <input type="hidden" name="portfolio_id" id="buy-portfolio-id">
        <input type="hidden" name="entry_price" id="buy-entry-price">
        <input type="hidden" name="stop_loss" id="buy-stop-loss">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Ticker</label>
            <input class="form-control" name="ticker" id="buy-ticker" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col">
              <label class="form-label">Shares</label>
              <input class="form-control" name="shares" type="number" step="any" min="0.0001" required>
            </div>
            <div class="col">
              <label class="form-label">Price ($)</label>
              <input class="form-control" name="price" id="buy-price" type="number" step="any" min="0.0001" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input class="form-control" name="date" type="date" id="buy-date" required>
          </div>
          <div class="mb-1">
            <label class="form-label">Notes</label>
            <input class="form-control" name="notes" placeholder="Optional">
          </div>
        </div>
        <div class="modal-footer">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Bootstrap provides Escape and focus trapping; keep the safer action first.
  document.addEventListener('shown.bs.modal', (event) => {
    event.target.querySelector('[data-initial-focus]')?.focus();
  });

  // Active-portfolio selection is per-browser (localStorage), like the
  // watchlist controls (#147). "" means "no selection / use the default".
  function activePortfolio() {
    return localStorage.getItem('activePortfolioId') || '';
  }
  function setActivePortfolio(id) {
    if (id === null || id === undefined || id === '') {
      localStorage.removeItem('activePortfolioId');
    } else {
      localStorage.setItem('activePortfolioId', String(id));
    }
  }

  function openBuy(ticker, price, entry, stop) {
    document.getElementById('buy-portfolio-id').value = activePortfolio();
    const buyPrice = parseFloat(price) || 0;
    const analystStop = (stop && stop !== 'null') ? parseFloat(stop) : null;
    const floorStop = buyPrice > 0 ? parseFloat((buyPrice * 0.90).toFixed(2)) : null;
    const stopVal = analystStop !== null ? Math.max(analystStop, floorStop) : floorStop;
    document.getElementById('buy-ticker').value      = ticker;
    document.getElementById('buy-price').value       = price || '';
    document.getElementById('buy-entry-price').value = (entry && entry !== 'null') ? entry : '';
    document.getElementById('buy-stop-loss').value   = stopVal !== null ? stopVal.toFixed(2) : '';
    document.getElementById('buy-date').value        = new Date().toISOString().slice(0,10);
    new bootstrap.Modal(document.getElementById('buyModal')).show();
  }

  function openAdjust(ticker, shares, price, entryDate, stop, entryPrice) {
    document.getElementById('adjust-portfolio-id').value = activePortfolio();
    document.getElementById('adjust-ticker').value = ticker;
    document.getElementById('adjust-shares').value = shares || '';
    document.getElementById('adjust-price').value = price || '';
    document.getElementById('adjust-date').value = entryDate || new Date().toISOString().slice(0,10);
    document.getElementById('adjust-stop-loss').value = stop || '';
    document.getElementById('adjust-entry-price').value = entryPrice || '';
    document.getElementById('adjust-notes').value = 'Adjustment';
    new bootstrap.Modal(document.getElementById('adjustModal')).show();
  }

  function openSell(ticker, shares, price) {
    document.getElementById('sell-portfolio-id').value = activePortfolio();
    document.getElementById('sell-ticker').value = ticker;
    document.getElementById('sell-shares').value = shares || '';
    document.getElementById('sell-price').value  = price || '';
    document.getElementById('sell-date').value   = new Date().toISOString().slice(0,10);
    new bootstrap.Modal(document.getElementById('sellModal')).show();
  }

  // Notification centre: mark-read deep-links to the relevant tab, then
  // closes the bell dropdown (#80).
  function notifDeepLink(tabId) {
    const link = document.getElementById(tabId);
    if (link) { link.click(); }
    const bell = document.getElementById('nav-bell-btn');
    if (bell && window.bootstrap) {
      const dd = bootstrap.Dropdown.getInstance(bell);
      if (dd) { dd.hide(); }
    }
  }

  // Marks one notification read as a side effect of clicking its native
  // detail link, without blocking that link's own navigation request
  // (#80, Story 2.8 AC6 markup fix -- the row is no longer one synthetic
  // clickable <li>, so its detail <a> triggers this itself).
  function markNotificationRead(notificationId) {
    if (window.htmx) {
      htmx.ajax('POST', `/notifications/${notificationId}/read`, {
        target: '#notif-list', swap: 'innerHTML',
      });
    }
  }

  // Keep active tab in sync with navigation clicks
  document.getElementById('mainTabs').addEventListener('click', function(e) {
    const link = e.target.closest('.nav-link');
    if (!link) return;
    document.querySelectorAll('#mainTabs .nav-link').forEach(t => t.classList.remove('active'));
    link.classList.add('active');
  });

  // After a trade form (from a modal) updates #tab-content, activate the Portfolio tab
  document.body.addEventListener('htmx:afterSettle', function(e) {
    if (e.detail.target.id !== 'tab-content') return;
    if (e.detail.elt && e.detail.elt.tagName === 'FORM') {
      document.querySelectorAll('#mainTabs .nav-link').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-portfolio').classList.add('active');
    }
  });

  async function refreshPortfolioPrices() {
    const btn = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    const text = document.getElementById('refreshText');

    btn.disabled = true;
    icon.classList.add('spin');
    text.textContent = 'Fetching...';

    try {
      const pid = activePortfolio();
      const url = pid ? '/api/portfolio/refresh?portfolio_id=' + encodeURIComponent(pid)
                      : '/api/portfolio/refresh';
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      const html = await response.text();
      document.getElementById('tab-content').innerHTML = html;
    } catch (error) {
      if (btn) { btn.disabled = false; }
      if (icon) { icon.classList.remove('spin'); }
      if (text) { text.textContent = 'Refresh Prices'; }
      alert('Failed to fetch prices: ' + error.message);
    }
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // Queues multiple SIPP CSVs through the single-file /import-sipp endpoint,
  // one request at a time (its destination path and cash-balance detection
  // are per-file, so concurrent uploads would race). Each response is a
  // full _portfolio.html partial; only the final displayed one is used for
  // positions/cash (always recomputed fresh from the DB), while per-file
  // buy/sell/cash/skipped counts and row-count status are read off
  // `data-import-*` attributes on its success banner, kept per file so the
  // combined message can show a breakdown per import rather than only a
  // grand total (#183, #187).
  async function handleSippImportSubmit(event, form) {
    event.preventDefault();
    const fileInput = form.querySelector('input[type=file]');
    const files = Array.from(fileInput.files || []);
    if (!files.length) return false;

    // FR-5/AD-27: the portfolio ID this queue is importing into is captured
    // once, up front, and reused unchanged for every queued file for the
    // rest of this function — this is the "locked" ID both the selector
    // disable below and the discard guard further down compare against.
    const portfolioId = form.querySelector('input[name=portfolio_id]').value;
    // Story 3.3/AD-27: provider_id/account_type_id are captured once here,
    // alongside portfolioId, and reused for every queued file -- same
    // pinning rationale as portfolioId. Guarded the same defensive way as
    // the existing `selectEl` lookup below: either select may legitimately
    // be absent (e.g. `no_portfolios`'s empty state), and this must never
    // throw if so.
    const providerSelectEl = form.querySelector('select[name=provider_id]');
    const accountTypeSelectEl = form.querySelector('select[name=account_type_id]');
    const providerId = providerSelectEl ? providerSelectEl.value : '';
    const accountTypeId = accountTypeSelectEl ? accountTypeSelectEl.value : '';
    const btn = form.querySelector('button[type=submit]');
    const originalBtnHtml = btn.innerHTML;
    // AD-27/AC3: disable the account selector for the duration of this
    // queue so the active portfolio can't change out from under it via the
    // one control this can directly block. `no_portfolios`'s empty state
    // renders no #portfolioSelect at all (nothing to import into yet), so
    // this element may legitimately be absent -- guard defensively.
    const selectEl = document.getElementById('portfolioSelect');
    btn.disabled = true;
    fileInput.disabled = true;
    if (selectEl) selectEl.disabled = true;
    if (providerSelectEl) providerSelectEl.disabled = true;
    if (accountTypeSelectEl) accountTypeSelectEl.disabled = true;

    let lastHtml = null;
    let lastSuccessHtml = null;
    const fileSummaries = [];
    const failures = [];

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      btn.textContent = files.length > 1
        ? `Importing ${i + 1} of ${files.length}...`
        : 'Importing...';
      try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('portfolio_id', portfolioId);
        formData.append('provider_id', providerId);
        formData.append('account_type_id', accountTypeId);
        const response = await fetch('/import-sipp', { method: 'POST', body: formData });
        const html = await response.text();
        lastHtml = html;
        const doc = new DOMParser().parseFromString(html, 'text/html');
        if (response.ok) lastSuccessHtml = html;
        const banner = doc.querySelector('[data-import-buy-count]');
        // AC1/AC2: a non-2xx response with a result banner is a
        // status="error" row-count mismatch (#187) — the import still
        // committed real buy/sell/cash rows, it's a data-quality warning,
        // not an outright failure. Surface its counts in the summary like
        // a success, flagged, rather than lumping it into `failures` (which
        // reports uploads that never produced a result at all — bad CSV,
        // unknown portfolio, etc.) and losing that detail.
        if (banner) {
          fileSummaries.push({
            name: file.name,
            buys: parseInt(banner.getAttribute('data-import-buy-count'), 10) || 0,
            sells: parseInt(banner.getAttribute('data-import-sell-count'), 10) || 0,
            cash: parseInt(banner.getAttribute('data-import-cash-count'), 10) || 0,
            skipped: parseInt(banner.getAttribute('data-import-skipped-count'), 10) || 0,
            mismatched: !response.ok,
          });
        } else if (response.ok) {
          // A 2xx response with no result banner isn't a failure -- every
          // known "ok"/"error" path renders one, so this is defensive: a
          // successful response the summary has nothing to report for is
          // not the same as a file that failed to import.
          fileSummaries.push({
            name: file.name, buys: 0, sells: 0, cash: 0, skipped: 0, mismatched: false,
          });
        } else {
          const errEl = doc.querySelector('.alert-danger span');
          failures.push(file.name + ': ' + (errEl ? errEl.textContent.trim() : 'import failed'));
        }
      } catch (error) {
        failures.push(file.name + ': ' + error.message);
      }
    }

    const displayHtml = lastSuccessHtml || lastHtml;
    if (!displayHtml) {
      // Every file failed before a response came back (e.g. offline) — the
      // one path that finishes without the innerHTML swap below, which in
      // every other path implicitly delivers a fresh, non-disabled
      // selector from the server. Explicitly undo the disabled state here.
      btn.disabled = false;
      fileInput.disabled = false;
      if (selectEl) selectEl.disabled = false;
      if (providerSelectEl) providerSelectEl.disabled = false;
      if (accountTypeSelectEl) accountTypeSelectEl.disabled = false;
      btn.innerHTML = originalBtnHtml;
      alert('Import failed: ' + failures.join('; '));
      return false;
    }
    // AD-27/AC4: discard a response whose portfolio ID no longer matches
    // the active view. Compares against the *live* activePortfolio() call
    // (reads localStorage synchronously), not a value cached earlier, so
    // it also catches ways the active portfolio can change *without* going
    // through the now-disabled #portfolioSelect: the delete/create-portfolio
    // forms (each replaces #tab-content and re-asserts data-active-portfolio
    // via _portfolio.html's own bottom script), or a second tab/window
    // changing the same localStorage key. Re-enable btn/fileInput/selectEl
    // here too: typically a no-op for the delete/create case (one of those
    // paths already replaced #tab-content wholesale, detaching these
    // elements), but not guaranteed -- included defensively, and it is the
    // one path that actually undoes the disable for the second-tab/window
    // case (and clicking Delete then cancelling its confirm() --
    // setActivePortfolio('') in its onclick fires before the confirm,
    // unconditionally), where *this* tab's #tab-content was never touched
    // by anything else and the controls would otherwise stay disabled
    // until the user reloads the page.
    if (activePortfolio() !== portfolioId) {
      btn.disabled = false;
      fileInput.disabled = false;
      if (selectEl) selectEl.disabled = false;
      if (providerSelectEl) providerSelectEl.disabled = false;
      if (accountTypeSelectEl) accountTypeSelectEl.disabled = false;
      btn.innerHTML = originalBtnHtml;
      // AC4 discards the *rendered view*, not the writes themselves: every
      // file already POSTed before the switch was written to the portfolio
      // this queue was locked to (formData's portfolio_id, captured once,
      // above), regardless of what's active now. A fully successful queue
      // must not go silent just because nothing hard-failed -- the user
      // needs to know data landed somewhere they're no longer looking.
      const parts = [];
      if (fileSummaries.length) {
        parts.push(fileSummaries.length + ' file(s) were already imported '
          + 'before the active portfolio changed');
      }
      if (failures.length) {
        parts.push(failures.length + ' file(s) failed: ' + failures.join('; '));
      }
      alert('Import discarded (active portfolio changed). ' + parts.join('; '));
      return false;
    }
    document.getElementById('tab-content').innerHTML = displayHtml;

    // AC6: move focus to the outcome banner (success or error) so
    // keyboard/AT users land on the result without hunting for it.
    const alertEl = document.querySelector('#tab-content [role="alert"]');
    if (alertEl) alertEl.focus();

    if (files.length > 1) {
      const mismatchedCount = fileSummaries.filter((f) => f.mismatched).length;
      const successCount = files.length - failures.length - mismatchedCount;
      const lines = fileSummaries.map((f) => {
        const flag = f.mismatched ? ' — ROW COUNT MISMATCH, check details' : '';
        return `${escapeHtml(f.name)}: ${f.buys} buy(s), ${f.sells} sell(s), `
          + `${f.cash} cash txn(s), ${f.skipped} skipped${flag}`;
      });
      if (failures.length) {
        lines.push(...failures.map((f) => `${escapeHtml(f)} — failed`));
      }
      const summaryHtml = `Imported ${successCount} of ${files.length} file(s):`
        + `<ul class="mb-0 ps-3">${lines.map((l) => `<li>${l}</li>`).join('')}</ul>`;
      const banner = document.querySelector('#tab-content [data-import-buy-count]');
      if (banner) {
        banner.querySelector('span').innerHTML = summaryHtml;
        if ((mismatchedCount || failures.length) && !banner.classList.contains('alert-danger')) {
          banner.classList.remove('alert-success');
          banner.classList.add('alert-danger');
        }
      } else {
        alert(`Imported ${successCount} of ${files.length} file(s) — see log for details.`);
      }
    }
    return false;
  }
</script>
