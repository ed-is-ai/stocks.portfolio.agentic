<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Trader</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/watchlist.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ── Design tokens ─────────────────────────────── */
    :root {
      --primary:     #0f2744;
      --primary-2:   #123a63;
      --surface:     #f1f5f9;
      --border:      #e2e8f0;
      --muted:       #64748b;
      /* Brand accent — emerald→cyan "growth" gradient */
      --accent:      #10b981;
      --accent-2:    #22d3ee;
      --brand-grad:  linear-gradient(120deg, var(--accent) 0%, var(--accent-2) 100%);
      --navbar-grad: linear-gradient(115deg, #0b1f38 0%, var(--primary) 45%, var(--primary-2) 100%);
      --green:       #16a34a;
      --green-bg:    #dcfce7;
      --amber:       #b45309;
      --amber-bg:    #fef3c7;
      --red:         #dc2626;
      --red-bg:      #fee2e2;
      --blue:        #1d4ed8;
      --blue-bg:     #dbeafe;
      --purple:      #7c3aed;
      --purple-bg:   #ede9fe;
      --orange:      #c2410c;
      --orange-bg:   #fff7ed;
    }

    /* ── Base ──────────────────────────────────────── */
    /* Font family, size, and numeric treatment come from theme.css tokens. */
    body {
      background:
        radial-gradient(1200px 400px at 100% -5%, #e6fbf4 0%, rgba(230,251,244,0) 60%),
        var(--surface);
      color: #1e293b;
    }

    /* ── Navbar ────────────────────────────────────── */
    .navbar {
      background: var(--navbar-grad) !important;
      box-shadow: 0 2px 14px rgba(8,17,32,0.28);
      padding: 0.55rem 1.25rem;
      border-bottom: 2px solid transparent;
      border-image: var(--brand-grad) 1;
    }
    .navbar-brand {
      font-weight: var(--fw-bold);
      font-size: var(--fs-md);
      letter-spacing: -0.01em;
      color: white !important;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    /* Logo mark: icon in a rounded gradient badge */
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 0.5rem;
      background: var(--brand-grad);
      box-shadow: 0 2px 8px rgba(16,185,129,0.35);
    }
    .brand-mark .bi { color: #06231b; font-size: 1.05rem; }
    .brand-name { color: #fff; }
    .brand-name em { font-style: normal; color: var(--accent-2); }
    .navbar-tag {
      font-size: var(--fs-xs);
      color: rgba(255,255,255,0.55);
      padding-left: 0.7rem;
      border-left: 1px solid rgba(255,255,255,0.16);
    }

    /* ── Tab bar ───────────────────────────────────── */
    .tab-bar {
      background: white;
      border-bottom: 2px solid var(--border);
      padding: 0 0.5rem;
      display: flex;
      align-items: flex-end;
    }
    .nav-tabs { border: none; }
    .nav-tabs .nav-item { margin-bottom: -2px; }
    .nav-tabs .nav-link {
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--muted);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      padding: 0.6rem 1rem;
      transition: color .15s, border-color .15s;
    }
    .nav-tabs .nav-link:hover { color: var(--primary); background: none; border-bottom-color: var(--border); }
    .nav-tabs .nav-link.active {
      color: var(--primary);
      font-weight: var(--fw-semibold);
      border-image: var(--brand-grad) 1;
      border-bottom: 2px solid;
      background: none;
    }
    .nav-tabs .nav-link.active .bi { color: var(--accent); }
    .nav-tabs .nav-link .bi { margin-right: 0.3rem; font-size: 0.82rem; }

    /* ── Content panel ─────────────────────────────── */
    #tab-content {
      background: white;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 0.5rem 0.5rem;
      padding: 1.25rem 1.5rem;
      min-height: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* ── Tables ────────────────────────────────────── */
    .tbl-wrap { overflow-y: auto; max-height: 72vh; border-radius: 0.4rem; border: 1px solid var(--border); }
    /* Short viewports (e.g. landscape phones): leave enough room
       above the fixed pipeline status bar that its own horizontal
       scrollbar never lands under it. Scoped to the watchlist wrap
       (.wl-tbl-wrap, set in watchlist.css) so portfolio/history
       tables keep their existing 72vh behavior. */
    @media (max-height: 480px) {
      .wl-tbl-wrap { max-height: 58vh; }
    }
    .table { font-size: var(--fs-sm); margin-bottom: 0; }
    .table thead th {
      background: var(--primary);
      color: rgba(255,255,255,0.88);
      font-weight: var(--fw-semibold);
      font-size: var(--fs-2xs);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: none;
      padding: 0.58rem 0.75rem;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .table tbody td { padding: 0.42rem 0.75rem; border-color: var(--border); vertical-align: middle; }
    .table tbody tr:hover td { background: #f8fafc; }
    .table tbody tr:last-child td { border-bottom: none; }

    /* ── PnL ───────────────────────────────────────── */
    .pos { color: var(--green); font-weight: 600; }
    .neg { color: var(--red);   font-weight: 600; }

    /* ── Stat cards (portfolio summary) ────────────── */
    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 0.5rem;
      padding: 0.65rem 1.1rem;
      min-width: 150px;
      box-shadow: 0 1px 3px rgba(15,39,68,0.05);
    }
    .stat-card .slbl {
      font-size: var(--fs-2xs);
      font-weight: var(--fw-semibold);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.2rem;
    }
    .stat-card .sval { font-size: var(--fs-lg); font-weight: var(--fw-bold); color: #1e293b; line-height: var(--lh-tight); }

    /* ── Exit signal badges ────────────────────────── */
    .exit-badge {
      display: inline-block;
      padding: 0.18rem 0.5rem;
      border-radius: 0.35rem;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: help;
    }
    .exit-EXIT { background: var(--red-bg);   color: var(--red);   }
    .exit-ADD  { background: var(--green-bg); color: var(--green); }

    /* ── Portfolio row tints ───────────────────────── */
    tr.row-exit td { background: #fff8f8 !important; }
    tr.row-exit:hover td { background: #fee2e2 !important; }

    /* ── Action buttons ────────────────────────────── */
    .btn-buy-sm, .btn-sell-sm, .btn-adjust-sm {
      border: none;
      font-weight: 600;
      font-size: 0.72rem;
      padding: 0.22rem 0.62rem;
      border-radius: 0.3rem;
      cursor: pointer;
      transition: background .15s;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .btn-buy-sm    { background: var(--green); color: white; }
    .btn-buy-sm:hover    { background: #15803d; }
    .btn-sell-sm   { background: var(--red);   color: white; }
    .btn-sell-sm:hover   { background: #b91c1c; }
    .btn-adjust-sm { background: #4f46e5;      color: white; }
    .btn-adjust-sm:hover { background: #3730a3; }

    /* ── Run log ───────────────────────────────────── */
    .badge-status {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .status-ok    { background: var(--green-bg);  color: var(--green);  }
    .status-error { background: var(--red-bg);    color: var(--red);    }
    .status-skip  { background: var(--amber-bg);  color: var(--amber);  }
    .rl-num {
      display: inline-block;
      min-width: 1.6rem;
      text-align: center;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-weight: 700;
      font-size: 0.76rem;
    }
    .rl-buy  { background: var(--green-bg); color: var(--green); }
    .rl-sell { background: var(--red-bg);   color: var(--red);   }
    .rl-error { font-size: 0.72rem; color: var(--red); }

    /* ── Toolbar above tables ──────────────────────── */
    .tbl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
      font-size: var(--fs-sm);
      color: var(--muted);
    }

    /* ── HTMX spinner ──────────────────────────────── */
    .spinner-border-sm { width: 1rem; height: 1rem; }

    /* ── Spin animation ────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    /* ── Modals ────────────────────────────────────── */
    .modal-content { border: none; border-radius: 0.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .modal-header { padding: 0.85rem 1.25rem; border-radius: calc(0.5rem - 1px) calc(0.5rem - 1px) 0 0; border-bottom: 1px solid rgba(255,255,255,0.15); }
    .modal-header .btn-close { filter: invert(1) opacity(0.7); }
    .modal-title { font-weight: var(--fw-semibold); font-size: var(--fs-base); }
    .modal-body { padding: 1.25rem; }
    .modal-footer { padding: 0.75rem 1.25rem; background: #f8fafc; border-top: 1px solid var(--border); border-radius: 0 0 calc(0.5rem - 1px) calc(0.5rem - 1px); }
    .form-label { font-size: 0.76rem; font-weight: 600; color: #374151; margin-bottom: 0.3rem; }
    .form-control, .form-select { font-size: 0.85rem; border-color: var(--border); }
    .form-control:focus, .form-select:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
    .pipeline-status-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: white; border-top: 1px solid var(--border); box-shadow: 0 -2px 8px rgba(0,0,0,.06); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pipeline-status { min-height: 2.35rem; display: flex; align-items: center; gap: 1rem; padding: .45rem 1.25rem; font-size: .78rem; color: var(--muted); overflow-x: auto; }
    .pipeline-status-summary, .pipeline-stages, .pipeline-stage { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
    .pipeline-stages { list-style: none; margin: 0; padding: 0; gap: .75rem; }
    .pipeline-stage.pending, .pipeline-stage.skipped { opacity: .55; }
    .pipeline-stage.complete { color: var(--green); }
    .pipeline-stage.failed, .pipeline-status-error { color: var(--red); }
    .pipeline-stage-count { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pipeline-status.running { color: var(--blue); background: linear-gradient(100deg, var(--blue-bg) 0%, #eff6ff 45%, var(--blue-bg) 80%); background-size: 220% 100%; animation: pipeline-sheen 1.8s linear infinite; }
    .pipeline-status.running .pipeline-status-summary > .bi { animation: pipeline-spin 1s linear infinite; }
    .pipeline-status.failed { color: var(--red); background: var(--red-bg); }
    .pipeline-status.complete { color: var(--green); background: var(--green-bg); }
    .pipeline-status.partial, .pipeline-status.skipped { color: var(--amber); background: var(--amber-bg); }
    @keyframes pipeline-sheen { to { background-position: -220% 0; } }
    @keyframes pipeline-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pipeline-status.running, .pipeline-status.running .pipeline-status-summary > .bi { animation: none; } }
    /* Reserve room for the fixed pipeline status bar (incl. its own
       safe-area padding) so it never sits over the last table row. */
    body { padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px)); }
    .pipeline-confirmation { position: fixed; inset: 0; z-index: 1050; display: grid; place-items: center; background: rgba(15, 23, 42, .42); padding: 1rem; }
    .pipeline-confirmation-card { width: min(32rem, 100%); background: white; border-radius: .65rem; box-shadow: 0 20px 50px rgba(0,0,0,.24); padding: 1.3rem; }
    .pipeline-confirmation h2 { font-size: 1rem; font-weight: 700; color: var(--amber); margin: 0 0 .75rem; }
    .pipeline-confirmation ul { padding-left: 1.2rem; margin-bottom: .9rem; font-size: .85rem; }
    .pipeline-confirmation li { margin-bottom: .55rem; }
    .pipeline-confirmation li span { color: var(--muted); }
    .pipeline-confirmation-actions { display: flex; justify-content: flex-end; gap: .5rem; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center gap-3">
    <span class="navbar-brand">
      <span class="brand-mark"><i class="bi bi-graph-up-arrow"></i></span>
      <span class="brand-name">Stock<em>Trader</em></span>
    </span>
    <span class="navbar-tag">Portfolio Manager</span>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button id="refresh-data-button" class="btn btn-sm btn-light btn-refresh"
            hx-post="/refresh-data"
            hx-target="#tab-content" hx-swap="innerHTML"
            hx-indicator="#spinner">
      <i class="bi bi-arrow-clockwise"></i> Refresh Data
    </button>
    <span id="spinner" class="htmx-indicator spinner-border spinner-border-sm text-light"></span>
  </div>
</nav>

<div class="container-fluid mt-3 px-3">

  <!-- Tab bar -->
  <div class="tab-bar">
    <ul class="nav nav-tabs" id="mainTabs">
      <li class="nav-item">
        <a class="nav-link active" id="tab-watchlist"
           hx-get="/partials/watchlist" hx-target="#tab-content" hx-trigger="click, load" hx-indicator="#spinner">
          <i class="bi bi-eye"></i>Watchlist
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-portfolio"
           hx-get="/partials/portfolio" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner">
          <i class="bi bi-briefcase"></i>Portfolio
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-history"
           hx-get="/partials/history" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner">
          <i class="bi bi-clock-history"></i>Trade History
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="tab-runlog"
           hx-get="/partials/runlog" hx-target="#tab-content" hx-trigger="click" hx-indicator="#spinner">
          <i class="bi bi-journal-text"></i>Run Log
        </a>
      </li>
    </ul>
  </div>

  <!-- Tab content -->
  <div id="tab-content">
    <div class="text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm mb-2 d-block mx-auto"></div>
      Loading…
    </div>
  </div>

</div>

<div id="pipeline-status" class="pipeline-status-bar"
     hx-get="/pipeline-status" hx-trigger="load" hx-swap="innerHTML"></div>
<div id="pipeline-confirmation"></div>

<!-- Buy Modal -->
<div class="modal fade" id="buyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background:#166534;">
        <h5 class="modal-title text-white"><i class="bi bi-cart-plus me-2"></i>Record Buy</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form hx-post="/trades" hx-target="#tab-content" hx-swap="innerHTML"
            hx-on::after-request="bootstrap.Modal.getInstance(document.getElementById('buyModal')).hide()">
        <input type="hidden" name="action" value="BUY">
        <input type="hidden" name="entry_price" id="buy-entry-price">
        <input type="hidden" name="stop_loss" id="buy-stop-loss">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Ticker</label>
            <input class="form-control" name="ticker" id="buy-ticker" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col">
              <label class="form-label">Shares</label>
              <input class="form-control" name="shares" type="number" step="any" min="0.0001" required>
            </div>
            <div class="col">
              <label class="form-label">Price ($)</label>
              <input class="form-control" name="price" id="buy-price" type="number" step="any" min="0.0001" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input class="form-control" name="date" type="date" id="buy-date" required>
          </div>
          <div class="mb-1">
            <label class="form-label">Notes</label>
            <input class="form-control" name="notes" placeholder="Optional">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success btn-sm fw-semibold"><i class="bi bi-check-lg me-1"></i>Record Buy</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Sell Modal -->
<div class="modal fade" id="sellModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background:#991b1b;">
        <h5 class="modal-title text-white"><i class="bi bi-dash-circle me-2"></i>Record Sell</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form hx-post="/trades" hx-target="#tab-content" hx-swap="innerHTML"
            hx-on::after-request="bootstrap.Modal.getInstance(document.getElementById('sellModal')).hide()">
        <input type="hidden" name="action" value="SELL">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Ticker</label>
            <input class="form-control" name="ticker" id="sell-ticker" readonly>
          </div>
          <div class="row g-2 mb-3">
            <div class="col">
              <label class="form-label">Shares</label>
              <input class="form-control" name="shares" id="sell-shares" type="number" step="any" min="0.0001" required>
            </div>
            <div class="col">
              <label class="form-label">Price ($)</label>
              <input class="form-control" name="price" id="sell-price" type="number" step="any" min="0.0001" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input class="form-control" name="date" type="date" id="sell-date" required>
          </div>
          <div class="mb-1">
            <label class="form-label">Notes</label>
            <input class="form-control" name="notes" placeholder="Optional">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger btn-sm fw-semibold"><i class="bi bi-check-lg me-1"></i>Record Sell</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Adjust Modal -->
<div class="modal fade" id="adjustModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background:#0f4c81;">
        <h5 class="modal-title text-white"><i class="bi bi-pencil-square me-2"></i>Adjust Position</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form hx-post="/trades" hx-target="#tab-content" hx-swap="innerHTML"
            hx-on::after-request="bootstrap.Modal.getInstance(document.getElementById('adjustModal')).hide()">
        <input type="hidden" name="action" value="CORRECT">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Ticker</label>
            <input class="form-control" name="ticker" id="adjust-ticker" readonly>
          </div>
          <div class="row g-2 mb-3">
            <div class="col">
              <label class="form-label">Shares</label>
              <input class="form-control" name="shares" id="adjust-shares" type="number" step="any" min="0.0001" required>
            </div>
            <div class="col">
              <label class="form-label">Price ($)</label>
              <input class="form-control" name="price" id="adjust-price" type="number" step="any" min="0.0001" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input class="form-control" name="date" type="date" id="adjust-date" required>
          </div>
          <div class="row g-2 mb-3">
            <div class="col">
              <label class="form-label">Entry Price</label>
              <input class="form-control" name="entry_price" id="adjust-entry-price" type="number" step="any" min="0">
            </div>
            <div class="col">
              <label class="form-label">Stop Loss</label>
              <input class="form-control" name="stop_loss" id="adjust-stop-loss" type="number" step="any" min="0">
            </div>
          </div>
          <div class="mb-1">
            <label class="form-label">Notes</label>
            <input class="form-control" name="notes" id="adjust-notes" placeholder="Optional">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm fw-semibold"><i class="bi bi-check-lg me-1"></i>Apply Adjustment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function openBuy(ticker, price, entry, stop) {
    const buyPrice = parseFloat(price) || 0;
    const analystStop = (stop && stop !== 'null') ? parseFloat(stop) : null;
    const floorStop = buyPrice > 0 ? parseFloat((buyPrice * 0.90).toFixed(2)) : null;
    const stopVal = analystStop !== null ? Math.max(analystStop, floorStop) : floorStop;
    document.getElementById('buy-ticker').value      = ticker;
    document.getElementById('buy-price').value       = price || '';
    document.getElementById('buy-entry-price').value = (entry && entry !== 'null') ? entry : '';
    document.getElementById('buy-stop-loss').value   = stopVal !== null ? stopVal.toFixed(2) : '';
    document.getElementById('buy-date').value        = new Date().toISOString().slice(0,10);
    new bootstrap.Modal(document.getElementById('buyModal')).show();
  }

  function openAdjust(ticker, shares, price, entryDate, stop, entryPrice) {
    document.getElementById('adjust-ticker').value = ticker;
    document.getElementById('adjust-shares').value = shares || '';
    document.getElementById('adjust-price').value = price || '';
    document.getElementById('adjust-date').value = entryDate || new Date().toISOString().slice(0,10);
    document.getElementById('adjust-stop-loss').value = stop || '';
    document.getElementById('adjust-entry-price').value = entryPrice || '';
    document.getElementById('adjust-notes').value = 'Adjustment';
    new bootstrap.Modal(document.getElementById('adjustModal')).show();
  }

  function openSell(ticker, shares, price) {
    document.getElementById('sell-ticker').value = ticker;
    document.getElementById('sell-shares').value = shares || '';
    document.getElementById('sell-price').value  = price || '';
    document.getElementById('sell-date').value   = new Date().toISOString().slice(0,10);
    new bootstrap.Modal(document.getElementById('sellModal')).show();
  }

  // Keep active tab in sync with navigation clicks
  document.getElementById('mainTabs').addEventListener('click', function(e) {
    const link = e.target.closest('.nav-link');
    if (!link) return;
    document.querySelectorAll('#mainTabs .nav-link').forEach(t => t.classList.remove('active'));
    link.classList.add('active');
  });

  // After a trade form (from a modal) updates #tab-content, activate the Portfolio tab
  document.body.addEventListener('htmx:afterSettle', function(e) {
    if (e.detail.target.id !== 'tab-content') return;
    if (e.detail.elt && e.detail.elt.tagName === 'FORM') {
      document.querySelectorAll('#mainTabs .nav-link').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-portfolio').classList.add('active');
    }
  });

  async function refreshPortfolioPrices() {
    const btn = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    const text = document.getElementById('refreshText');

    btn.disabled = true;
    icon.classList.add('spin');
    text.textContent = 'Fetching...';

    try {
      const response = await fetch('/api/portfolio/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      const html = await response.text();
      document.getElementById('tab-content').innerHTML = html;
    } catch (error) {
      if (btn) { btn.disabled = false; }
      if (icon) { icon.classList.remove('spin'); }
      if (text) { text.textContent = 'Refresh Prices'; }
      alert('Failed to fetch prices: ' + error.message);
    }
  }
</script>
<script src="/static/js/watchlist.js"></script>
<script src="/static/js/pipeline-refresh.js"></script>
</body>
</html>
